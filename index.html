
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root{
    --ocean:#0B4F6C;
    --ocean-dark:#083849;
    --mango:#FFB627;
    --coral:#F45B69;
    --cream:#FFF8ED;
    --ink:#20262B;
    --line:#E8DCC4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
  }
  h1,h2,h3,.brand{ font-family:'Baloo 2', sans-serif; }

  header{
    background:var(--ocean);
    color:#fff;
    padding:18px 20px;
    display:flex;
    align-items:center;
    gap:12px;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 3px 0 var(--mango);
  }
  header .backBtn{
    background:none;
    border:2px solid rgba(255,255,255,.5);
    color:#fff;
    border-radius:50%;
    width:36px;
    height:36px;
    font-size:18px;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  header .backBtn.show{ display:flex; }
  header .titles{ flex:1; }
  header .brand{ font-size:20px; font-weight:800; letter-spacing:.3px; }
  header .sub{ font-size:12.5px; opacity:.85; }

  main{ max-width:640px; margin:0 auto; padding:20px; }

  .intro{ margin-bottom:18px; }
  .intro h2{ font-size:22px; color:var(--ocean-dark); margin-bottom:4px; }
  .intro p{ font-size:14px; color:#5a5347; }

  .cat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .cat-card{
    background:#fff;
    border:2px solid var(--line);
    border-radius:18px;
    padding:20px 14px;
    text-align:center;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .cat-card:hover, .cat-card:focus-visible{
    transform:translateY(-3px);
    border-color:var(--mango);
    box-shadow:0 8px 18px rgba(11,79,108,.12);
    outline:none;
  }
  .cat-card .emoji{
    width:56px; height:56px;
    border-radius:50%;
    background:var(--cream);
    display:flex; align-items:center; justify-content:center;
    font-size:26px;
  }
  .cat-card .name{ font-weight:700; font-size:15px; color:var(--ocean-dark); }
  .cat-card .count{ font-size:12px; color:#8a8175; }

  .list-head{ margin-bottom:14px; }
  .list-head .eyebrow{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--coral); font-weight:700; }
  .list-head h2{ font-size:22px; color:var(--ocean-dark); }

  .place-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
    display:flex;
    gap:14px;
    align-items:center;
    cursor:pointer;
    transition:box-shadow .15s ease, border-color .15s ease;
  }
  .place-card:hover, .place-card:focus-visible{
    box-shadow:0 6px 16px rgba(11,79,108,.1);
    border-color:var(--mango);
    outline:none;
  }
  .place-card .thumb{
    width:52px; height:52px; border-radius:12px;
    background:var(--ocean);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:22px; flex-shrink:0;
  }
  .place-card .info{ flex:1; min-width:0; }
  .place-card .info h3{ font-size:16px; color:var(--ink); }
  .place-card .info .addr{ font-size:13px; color:#8a8175; margin-top:2px; }
  .place-card .info .tags{ margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; }
  .place-card .tag{
    font-size:11px; background:var(--cream); border:1px solid var(--line);
    padding:2px 8px; border-radius:99px; color:var(--ocean-dark); font-weight:600;
  }
  .place-card .arrow{ color:var(--mango); font-size:20px; flex-shrink:0; }

  .empty{ text-align:center; padding:40px 10px; color:#8a8175; font-size:14px; }

  .map-head h2{ font-size:22px; color:var(--ocean-dark); margin-bottom:2px; }
  .map-head .addr{ font-size:13.5px; color:#5a5347; margin-bottom:14px; }

  .map-frame{
    width:100%;
    height:320px;
    border:2px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    margin-bottom:16px;
  }
  .map-frame iframe{ width:100%; height:100%; border:0; }

  .directions-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%;
    background:var(--coral);
    color:#fff;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:16px;
    padding:14px;
    border:none;
    border-radius:14px;
    text-decoration:none;
    cursor:pointer;
    box-shadow:0 4px 0 #c2404c;
  }
  .directions-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #c2404c; }

    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
