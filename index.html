<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>San Ga Tayo? — Mauban Business Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ocean:#0B4F6C;
    --ocean-dark:#083849;
    --mango:#FFB627;
    --coral:#F45B69;
    --cream:#FFF8ED;
    --ink:#20262B;
    --line:#E8DCC4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
  }
  h1,h2,h3,.brand{ font-family:'Baloo 2', sans-serif; }

  header{
    background:var(--ocean);
    color:#fff;
    padding:18px 20px;
    display:flex;
    align-items:center;
    gap:12px;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 3px 0 var(--mango);
  }
  header .backBtn{
    background:none;
    border:2px solid rgba(255,255,255,.5);
    color:#fff;
    border-radius:50%;
    width:36px;
    height:36px;
    font-size:18px;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  header .backBtn.show{ display:flex; }
  header .titles{ flex:1; }
  header .brand{ font-size:20px; font-weight:800; letter-spacing:.3px; }
  header .sub{ font-size:12.5px; opacity:.85; }

  main{ max-width:640px; margin:0 auto; padding:20px; }

  .intro{ margin-bottom:18px; }
  .intro h2{ font-size:22px; color:var(--ocean-dark); margin-bottom:4px; }
  .intro p{ font-size:14px; color:#5a5347; }

  .cat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .cat-card{
    background:#fff;
    border:2px solid var(--line);
    border-radius:18px;
    padding:20px 14px;
    text-align:center;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .cat-card:hover, .cat-card:focus-visible{
    transform:translateY(-3px);
    border-color:var(--mango);
    box-shadow:0 8px 18px rgba(11,79,108,.12);
    outline:none;
  }
  .cat-card .emoji{
    width:56px; height:56px;
    border-radius:50%;
    background:var(--cream);
    display:flex; align-items:center; justify-content:center;
    font-size:26px;
  }
  .cat-card .name{ font-weight:700; font-size:15px; color:var(--ocean-dark); }
  .cat-card .count{ font-size:12px; color:#8a8175; }

  .list-head{ margin-bottom:14px; }
  .list-head .eyebrow{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--coral); font-weight:700; }
  .list-head h2{ font-size:22px; color:var(--ocean-dark); }

  .place-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
    display:flex;
    gap:14px;
    align-items:center;
    cursor:pointer;
    transition:box-shadow .15s ease, border-color .15s ease;
  }
  .place-card:hover, .place-card:focus-visible{
    box-shadow:0 6px 16px rgba(11,79,108,.1);
    border-color:var(--mango);
    outline:none;
  }
  .place-card .thumb{
    width:52px; height:52px; border-radius:12px;
    background:var(--ocean);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:22px; flex-shrink:0;
  }
  .place-card .info{ flex:1; min-width:0; }
  .place-card .info h3{ font-size:16px; color:var(--ink); }
  .place-card .info .addr{ font-size:13px; color:#8a8175; margin-top:2px; }
  .place-card .info .tags{ margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; }
  .place-card .tag{
    font-size:11px; background:var(--cream); border:1px solid var(--line);
    padding:2px 8px; border-radius:99px; color:var(--ocean-dark); font-weight:600;
  }
  .place-card .arrow{ color:var(--mango); font-size:20px; flex-shrink:0; }

  .empty{ text-align:center; padding:40px 10px; color:#8a8175; font-size:14px; }

  .map-head h2{ font-size:22px; color:var(--ocean-dark); margin-bottom:2px; }
  .map-head .addr{ font-size:13.5px; color:#5a5347; margin-bottom:14px; }

  .map-frame{
    width:100%;
    height:320px;
    border:2px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    margin-bottom:16px;
  }
  .map-frame iframe{ width:100%; height:100%; border:0; }

  .directions-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%;
    background:var(--coral);
    color:#fff;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:16px;
    padding:14px;
    border:none;
    border-radius:14px;
    text-decoration:none;
    cursor:pointer;
    box-shadow:0 4px 0 #c2404c;
  }
  .directions-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #c2404c; }

  .place-detail{
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    margin-top:14px;
    font-size:13.5px;
    color:#5a5347;
    line-height:1.5;
  }

  footer{ text-align:center; padding:26px 10px 40px; font-size:12px; color:#a89f8f; }

  .hidden{ display:none !important; }

  @media (prefers-reduced-motion: reduce){
    .cat-card, .place-card, .directions-btn{ transition:none; }
  }
</style>
</head>
<body>

<header>
  <button class="backBtn" id="backBtn" aria-label="Go back">←</button>
  <div class="titles">
    <div class="brand" id="headerTitle">San Ga Tayo?</div>
    <div class="sub" id="headerSub">Mauban, Quezon — hanapin natin</div>
  </div>
</header>

<main>

  <!-- SCREEN 1: CATEGORIES -->
  <section id="screen-categories">
    <div class="intro">
      <h2>Ikaw bay Pasaan?</h2>
      <p>Pumili ng kategorya para makita ang mga lugar sa paligid mo.</p>
    </div>
    <div class="cat-grid" id="catGrid"></div>
  </section>

  <!-- SCREEN 2: LISTINGS -->
  <section id="screen-listings" class="hidden">
    <div class="list-head">
      <div class="eyebrow" id="listEyebrow">Kategorya</div>
      <h2 id="listTitle">Mga Resort</h2>
    </div>
    <div id="listContainer"></div>
  </section>

  <!-- SCREEN 3: MAP / DETAIL -->
  <section id="screen-map" class="hidden">
    <div class="map-head">
      <h2 id="mapTitle">Place name</h2>
      <div class="addr" id="mapAddr">Address here</div>
    </div>
    <div class="map-frame">
      <iframe id="mapIframe" src="" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
    <a class="directions-btn" id="directionsLink" href="#" target="_blank" rel="noopener">
      📍 I-google Maps ang Direksyon
    </a>
    <div class="place-detail" id="placeDetail"></div>
  </section>

</main>

<footer>Sample data lang ito — palitan ng aktwal na mga negosyo, address, at coordinates.</footer>

<script>
/* ===========================================================
   DATA — replace with your real businesses.
   lat/lng: right-click the exact spot on Google Maps → the
   numbers that pop up at the top are the lat,lng to paste here.
   =========================================================== */
const CATEGORIES = [
  { id:'resort',  name:'Resort',       emoji:'🏖️' },
  { id:'cafe',    name:"Cafe's",       emoji:'☕' },
  { id:'parlor',  name:'Parlor',       emoji:'💇‍♀️' },
  { id:'barber',  name:'Barber Shop',  emoji:'💈' },
  { id:'market',  name:'Food Market',  emoji:'🥭' },
];

const PLACES = [
  { id:1, cat:'resort', name:'Liwayway Sono Benedetto Resort', addr:'Brgy. Liwayway, Mauban, Quezon', tags:['Swimming','Cottages'], lat:14.1930,lng:121.6826956, desc:'Cottages fronting the bay, open daily 7AM–7PM. Good for family day outings.' },
  { id:2, cat:'resort', name:'Kanluran Sunset Resort', addr:'Brgy. Kanluran, Mauban, Quezon', tags:['Beachfront','Events'], lat:14.1875, lng:122.1790, desc:'Popular for sunset views and small gatherings.' },
  { id:3, cat:'cafe', name:'Bayside Brew Cafe', addr:'Rizal St., Poblacion, Mauban, Quezon', tags:['Coffee','WiFi'], lat:14.1898, lng:122.1888, desc:'Cozy spot near the town plaza with decent WiFi for work.' },
  { id:4, cat:'cafe', name:'Kape Kubo', addr:'Brgy. Cagsiay I, Mauban, Quezon', tags:['Local coffee'], lat:14.1954, lng:122.1795, desc:'Traditional kapeng barako served native-style.' },
  { id:5, cat:'parlor', name:"Bella's Beauty Parlor", addr:'Quezon Ave., Mauban, Quezon', tags:['Hair','Nails'], lat:14.1902, lng:122.1867, desc:'Walk-ins welcome, closed Sundays.' },
  { id:6, cat:'barber', name:'Mang Tony Barbershop', addr:'National Highway, Mauban, Quezon', tags:['Haircut','Shave'], lat:14.1889, lng:122.1901, desc:'Classic barbershop, cash only.' },
  { id:7, cat:'barber', name:'Fade Masters', addr:'Brgy. Zone II, Mauban, Quezon', tags:['Fades','Kids cuts'], lat:14.1918, lng:122.1852, desc:'Modern fades, appointment recommended on weekends.' },
  { id:8, cat:'market', name:'Mauban Public Market', addr:'Poblacion, Mauban, Quezon', tags:['Fresh produce','Seafood'], lat:14.1901, lng:122.1876, desc:'Main wet and dry market, busiest early morning.' },
  { id:9, cat:'market', name:'Talipapa sa Cagsiay', addr:'Brgy. Cagsiay II, Mauban, Quezon', tags:['Vegetables','Fish'], lat:14.1962, lng:122.1811, desc:'Smaller neighborhood market, afternoons only.' },
];

/* ============ rendering ============ */
const screens = {
  categories: document.getElementById('screen-categories'),
  listings: document.getElementById('screen-listings'),
  map: document.getElementById('screen-map'),
};
const headerTitle = document.getElementById('headerTitle');
const headerSub = document.getElementById('headerSub');
const backBtn = document.getElementById('backBtn');

let currentCategory = null;

function showScreen(name){
  Object.values(screens).forEach(s => s.classList.add('hidden'));
  screens[name].classList.remove('hidden');
  backBtn.classList.toggle('show', name !== 'categories');
}

function renderCategories(){
  const grid = document.getElementById('catGrid');
  grid.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const count = PLACES.filter(p => p.cat === cat.id).length;
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.tabIndex = 0;
    card.innerHTML = `
      <div class="emoji">${cat.emoji}</div>
      <div class="name">${cat.name}</div>
      <div class="count">${count} lugar</div>
    `;
    card.addEventListener('click', () => openCategory(cat));
    card.addEventListener('keydown', e => { if(e.key==='Enter') openCategory(cat); });
    grid.appendChild(card);
  });
}

function openCategory(cat){
  currentCategory = cat;
  headerTitle.textContent = cat.name;
  headerSub.textContent = 'Piliin ang lugar';
  document.getElementById('listEyebrow').textContent = 'Kategorya';
  document.getElementById('listTitle').textContent = 'Mga ' + cat.name;

  const container = document.getElementById('listContainer');
  const items = PLACES.filter(p => p.cat === cat.id);
  container.innerHTML = '';

  if(items.length === 0){
    container.innerHTML = `<div class="empty">Wala pang naka-listang ${cat.name.toLowerCase()} dito. Idagdag mo sa PLACES array sa code.</div>`;
  } else {
    items.forEach(place => {
      const card = document.createElement('div');
      card.className = 'place-card';
      card.tabIndex = 0;
      card.innerHTML = `
        <div class="thumb">${cat.emoji}</div>
        <div class="info">
          <h3>${place.name}</h3>
          <div class="addr">${place.addr}</div>
          <div class="tags">${place.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        </div>
        <div class="arrow">›</div>
      `;
      card.addEventListener('click', () => openPlace(place));
      card.addEventListener('keydown', e => { if(e.key==='Enter') openPlace(place); });
      container.appendChild(card);
    });
  }
  showScreen('listings');
}

function openPlace(place){
  headerTitle.textContent = place.name;
  headerSub.textContent = 'Lokasyon';

  document.getElementById('mapTitle').textContent = place.name;
  document.getElementById('mapAddr').textContent = place.addr;
  document.getElementById('placeDetail').textContent = place.desc;

  const iframe = document.getElementById('mapIframe');
  iframe.src = `https://www.google.com/maps?q=${place.lat},${place.lng}&hl=en&z=16&output=embed`;

  const link = document.getElementById('directionsLink');
  link.href = `https://www.google.com/maps/dir/?api=1&destination=${place.lat},${place.lng}`;

  showScreen('map');
}

backBtn.addEventListener('click', () => {
  if(!screens.map.classList.contains('hidden')){
    openCategory(currentCategory);
  } else {
    headerTitle.textContent = 'Saan Tayo?';
    headerSub.textContent = 'Mauban, Quezon — hanapin natin';
    showScreen('categories');
  }
});

renderCategories();
showScreen('categories');
</script>
</body>
</html>
